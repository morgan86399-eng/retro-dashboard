<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>iPhone 4s 經典雙捲軸磁帶播客電台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    body {
      background: #2b2b2b;
      margin: 0;
      padding: 10px;
      font-family: -apple-system, "Heiti TC", "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #e2e8f0;
    }
    .header-bar {
      background: -webkit-linear-gradient(#3a3a3a, #1f1f1f);
      background: linear-gradient(#3a3a3a, #1f1f1f);
      -webkit-border-radius: 8px;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      border: 1px solid #141414;
      margin-bottom: 12px;
    }
    .header-bar h1 { margin: 0; font-size: 18px; color: #fbbf24; text-shadow: 0 1px 2px #000; }
    .header-bar p { margin: 4px 0 0; font-size: 11px; color: #94a3b8; }
    
    .tape-banner {
      background: -webkit-linear-gradient(135deg, #475569, #1e293b);
      background: linear-gradient(135deg, #475569, #1e293b);
      -webkit-border-radius: 8px;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
    }
    .tape-icon { font-size: 32px; margin-right: 12px; }
    .tape-text { font-size: 12px; color: #cbd5e1; line-height: 1.4; }

    .podcast-card {
      background: -webkit-linear-gradient(#262626, #1a1a1a);
      background: linear-gradient(#262626, #1a1a1a);
      -webkit-border-radius: 8px;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #383838;
      display: -webkit-box;
      display: flex;
      -webkit-box-align: center;
      align-items: center;
    }
    .podcast-cover {
      width: 60px;
      height: 60px;
      -webkit-border-radius: 6px;
      border-radius: 6px;
      margin-right: 12px;
      background: #111;
    }
    .podcast-info {
      -webkit-box-flex: 1;
      flex: 1;
      min-width: 0;
    }
    .podcast-title { font-size: 14px; font-weight: bold; color: #f8fafc; margin-bottom: 2px; }
    .podcast-author { font-size: 11px; color: #fbbf24; margin-bottom: 2px; }
    .podcast-desc { font-size: 10px; color: #94a3b8; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btn-sub {
      background: -webkit-linear-gradient(#eab308, #ca8a04);
      background: linear-gradient(#eab308, #ca8a04);
      color: #000;
      border: 1px solid #a16207;
      padding: 6px 12px;
      -webkit-border-radius: 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      margin-left: 8px;
    }

    .nav-links {
      text-align: center;
      margin-top: 15px;
      padding: 10px;
    }
    .nav-links a {
      color: #38bdf8;
      text-decoration: none;
      font-size: 12px;
      margin: 0 8px;
      font-weight: bold;
    }

    .loading { text-align: center; color: #94a3b8; padding: 20px; font-size: 13px; }
    .error { text-align: center; color: #ef4444; padding: 20px; font-size: 13px; }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>📻 經典雙捲軸磁帶播客電台</h1>
    <p>Official Podcasts.app 擬物卡帶播放器 · 現代 RSS 轉譯電台</p>
  </div>

  <div class="tape-banner">
    <div class="tape-icon">📼</div>
    <div class="tape-text">
      點選下方任一節目「<b>一鍵訂閱</b>」，Safari 將直接喚醒原生 <b>Podcasts.app</b>，享受經典雙盤捲軸轉動與擬物磁帶物理動畫！
    </div>
  </div>

  <div id="podcastList">
    <div class="loading">載入電台清單中...</div>
  </div>

  <script>
    /* iOS 6 compatible - XMLHttpRequest, no fetch, no arrow functions, no let/const */
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/podcasts', true);
    xhr.timeout = 10000;

    xhr.onreadystatechange = function() {
      if (xhr.readyState !== 4) return;
      var container = document.getElementById('podcastList');
      if (xhr.status === 200) {
        try {
          var items = JSON.parse(xhr.responseText);
          var html = '';
          for (var i = 0; i < items.length; i++) {
            var p = items[i];
            html +=
              '<div class="podcast-card">' +
                '<img class="podcast-cover" src="' + p.cover + '" alt="' + p.title + '">' +
                '<div class="podcast-info">' +
                  '<div class="podcast-title">' + p.title + '</div>' +
                  '<div class="podcast-author">' + p.author + '</div>' +
                  '<div class="podcast-desc">' + p.desc + '</div>' +
                '</div>' +
                '<a href="' + p.pcast_url + '" class="btn-sub">一鍵訂閱</a>' +
              '</div>';
          }
          container.innerHTML = html;
        } catch (e) {
          container.innerHTML = '<div class="error">解析電台資料失敗</div>';
        }
      } else {
        container.innerHTML = '<div class="error">載入電台清單失敗 (' + xhr.status + ')</div>';
      }
    };

    xhr.ontimeout = function() {
      document.getElementById('podcastList').innerHTML = '<div class="error">載入逾時，請重新整理</div>';
    };

    xhr.onerror = function() {
      document.getElementById('podcastList').innerHTML = '<div class="error">網路連線錯誤</div>';
    };

    xhr.send();
  </script>

  <div class="nav-links">
    <a href="/">&larr; 返回智慧儀表板</a>
    <a href="/store">🎮 懷舊市集</a>
  </div>

</body>
</html>
