<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>iPhone 4s 智慧儀表板</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="智慧儀表板">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="container">

    <!-- 頂部風格切換列 -->
    <div class="top-bar">
      <button id="btn-theme-picker" class="theme-switch-btn" type="button">&#127912; 風格: <span id="current-theme-name">經典擬物</span></button>
      <button id="btn-theme-next" class="theme-next-btn" type="button" title="快速下一個風格">&#10145;</button>
    </div>

    <div class="dashboard-columns">
      <!-- 左欄：時鐘、天氣、自建音樂 -->
      <div class="col-left">
        <!-- 頂部：擬物化時鐘與日期 -->
        <div class="card clock-card">
          <div class="clock-bezel">
            <div class="clock-face">
              <div id="clock-time">00:00:00</div>
              <div id="clock-date">載入中...</div>
            </div>
          </div>
        </div>

        <!-- 即時天氣 -->
        <div class="card weather-card">
          <div class="card-header">
            <span class="card-title">即時氣象</span>
            <span id="weather-city" class="card-tag">台北</span>
          </div>
          <div class="weather-body">
            <div class="weather-temp-box">
              <span id="weather-temp" class="weather-temp">--</span><span class="weather-unit">°C</span>
            </div>
            <div class="weather-info">
              <div id="weather-desc" class="weather-desc">載入中...</div>
              <div class="weather-sub">體感 <span id="weather-apparent">--</span>°C / 濕度 <span id="weather-humidity">--</span>%</div>
            </div>
          </div>
        </div>

        <!-- 自建音樂播放器 -->
        <div class="card music-card">
          <div class="card-header">
            <span class="card-title">自建音樂播放</span>
            <span id="music-track-count" class="card-sub">0 首曲目</span>
          </div>
          <div class="music-body">
            <div id="music-title" class="music-title">準備播放</div>
            <div class="progress-bar-container" id="progress-container">
              <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div class="music-time-row">
              <span id="current-time">00:00</span>
              <span id="duration-time">00:00</span>
            </div>
            <div class="music-mode-row">
              <button id="btn-shuffle" class="retro-sub-btn" type="button">&#128256; 隨機: 關</button>
              <button id="btn-loop" class="retro-sub-btn" type="button">&#128257; 循環: 全部</button>
            </div>
            <div class="music-controls">
              <button id="btn-prev" class="retro-btn" type="button">|&#9664;</button>
              <button id="btn-play" class="retro-btn btn-play" type="button">&#9654; 播放</button>
              <button id="btn-next" class="retro-btn" type="button">&#9654;|</button>
            </div>
            <audio id="audio-player" preload="none"></audio>
          </div>
        </div>
      </div>

      <!-- 右欄：股票大盤、留言板 -->
      <div class="col-right">
        <!-- 股票大盤指數 -->
        <div class="card stock-card">
          <div class="card-header">
            <span class="card-title">市場大盤指數</span>
            <span id="stock-update-time" class="card-sub">即時更新</span>
          </div>
          <div id="stock-list" class="stock-list">
            <!-- 預設先放一個台股大盤佔位，由 JS 動態更新 -->
            <div class="stock-item primary-stock">
              <div class="stock-name">加權指數 (台股大盤)</div>
              <div class="stock-digits">
                <span id="twii-price" class="stock-price">載入中...</span>
                <span id="twii-change" class="stock-change">--</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 留言板 -->
        <div class="card message-card">
          <div class="card-header">
            <span class="card-title">隨手留言板</span>
            <span class="card-sub">雙向同步</span>
          </div>
          <form id="msg-form" class="msg-form" action="javascript:void(0);">
            <input type="text" id="msg-author" class="retro-input author-input" placeholder="暱稱 (選填)" maxlength="12">
            <div class="msg-input-row">
              <input type="text" id="msg-content" class="retro-input content-input" placeholder="留句話吧..." maxlength="100">
              <button type="submit" id="btn-send" class="retro-btn btn-send">送出</button>
            </div>
          </form>
          <div id="message-list" class="message-list">
            <div class="msg-loading">載入留言中...</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 頁尾 -->
    <div class="footer">
      iPhone 4s Retro Dashboard &bull; iOS 6.1.3 OK
    </div>

  </div>

  <!-- 風格選擇彈出視窗 -->
  <div id="theme-modal" class="theme-modal" style="display: none;">
    <div class="theme-modal-backdrop" id="theme-modal-backdrop"></div>
    <div class="theme-modal-box">
      <div class="theme-modal-header">
        <span class="theme-modal-title">&#127912; 選擇心情風格 (10款)</span>
        <button type="button" id="btn-close-theme" class="theme-close-btn">&times;</button>
      </div>
      <div class="theme-grid" id="theme-grid">
        <!-- 由 JS 動態產生 10 種風格選項按鈕 -->
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
