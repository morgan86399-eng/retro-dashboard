<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Siri</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: rgba(0,0,0,0); }
    body {
      background: #111417;
      margin: 0;
      padding: 0;
      font-family: -apple-system, "Heiti TC", "Helvetica Neue", Helvetica, Arial, sans-serif;
      height: 100%;
      overflow: hidden;
      color: #fff;
    }
    html, body { height: 100%; }

    #app {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
      height: 100%;
    }

    .top-header {
      background: rgba(18, 22, 28, 0.95);
      border-bottom: 1px solid #232a35;
      padding: 10px 14px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      z-index: 10;
    }
    .top-header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: bold;
      color: #cbd5e1;
      text-shadow: 0 -1px 0 #000;
    }
    .back-btn {
      color: #94a3b8;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #334155;
      padding: 4px 8px;
      -webkit-border-radius: 6px;
      border-radius: 6px;
      background: #1e293b;
    }

    .chat-container {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px;
    }

    .bubble {
      max-width: 85%;
      padding: 10px 14px;
      -webkit-border-radius: 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 12px;
      word-wrap: break-word;
    }
    .bubble.user {
      margin-left: auto;
      background: -webkit-linear-gradient(#3b82f6, #1d4ed8);
      background: linear-gradient(#3b82f6, #1d4ed8);
      color: #fff;
      border: 1px solid #2563eb;
      -webkit-border-bottom-right-radius: 2px;
      border-bottom-right-radius: 2px;
    }
    .bubble.siri {
      margin-right: auto;
      background: -webkit-linear-gradient(#f8fafc, #f1f5f9);
      background: linear-gradient(#f8fafc, #f1f5f9);
      color: #0f172a;
      border: 1px solid #e2e8f0;
      -webkit-border-bottom-left-radius: 2px;
      border-bottom-left-radius: 2px;
    }

    .siri-card {
      margin-top: 8px;
      -webkit-border-radius: 10px;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
    }
    .card-weather {
      background: -webkit-linear-gradient(135deg, #0284c7, #0369a1);
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #fff;
      display: -webkit-box;
      display: flex;
      -webkit-box-pack: justify;
      justify-content: space-between;
      -webkit-box-align: center;
      align-items: center;
    }
    .weather-temp { font-size: 24px; font-weight: bold; }
    .card-stock {
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
    }
    .stock-price { font-size: 20px; font-weight: bold; color: #10b981; }

    .bottom-bar {
      background: -webkit-linear-gradient(top, #1a202c, #0f172a);
      background: linear-gradient(to bottom, #1a202c, #0f172a);
      border-top: 1px solid #334155;
      padding: 10px 14px;
      text-align: center;
    }

    .mic-button {
      width: 64px;
      height: 64px;
      -webkit-border-radius: 50%;
      border-radius: 50%;
      background: -webkit-radial-gradient(circle at 35% 35%, #a855f7, #6b21a8, #3b0764);
      background: radial-gradient(circle at 35% 35%, #a855f7, #6b21a8, #3b0764);
      border: 2px solid #c084fc;
      display: inline-block;
      font-size: 26px;
      cursor: pointer;
      color: #fff;
      margin-bottom: 8px;
      line-height: 60px;
      text-align: center;
    }

    .suggestions {
      display: -webkit-box;
      display: flex;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      width: 100%;
      padding-bottom: 6px;
      margin-bottom: 4px;
    }
    .pill {
      background: #334155;
      color: #cbd5e1;
      font-size: 11px;
      padding: 4px 10px;
      -webkit-border-radius: 12px;
      border-radius: 12px;
      white-space: nowrap;
      cursor: pointer;
      margin-right: 6px;
      display: inline-block;
    }

    .input-row {
      display: -webkit-box;
      display: flex;
      width: 100%;
    }
    .text-input {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      -webkit-border-radius: 18px;
      border-radius: 18px;
      padding: 8px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      margin-right: 8px;
    }
    .btn-send {
      background: -webkit-linear-gradient(#9333ea, #7e22ce);
      background: linear-gradient(#9333ea, #7e22ce);
      border: 1px solid #6b21a8;
      color: #fff;
      -webkit-border-radius: 16px;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="app">
    <div class="top-header">
      <a href="/" class="back-btn">&larr; 儀表板</a>
      <h1>Siri 智慧大腦</h1>
      <a href="/store" class="back-btn">市集</a>
    </div>

    <div class="chat-container" id="chat">
      <div class="bubble siri">
        我有什麼可以為您效勞？
      </div>
    </div>

    <div class="bottom-bar">
      <div class="suggestions">
        <div class="pill" onclick="sendQuery('今天桃園天氣如何？')">☀ 桃園天氣</div>
        <div class="pill" onclick="sendQuery('台積電股票行情')">📈 台積電</div>
        <div class="pill" onclick="sendQuery('講個笑話給我聽')">😄 笑話</div>
        <div class="pill" onclick="sendQuery('現在幾點了？')">⏰ 時間</div>
      </div>

      <div class="mic-button" id="micBtn" onclick="toggleMic()">
        🎙
      </div>

      <div class="input-row">
        <input type="text" id="queryInput" class="text-input" placeholder="輸入問題..." onkeydown="if(event.keyCode===13) handleSend()">
        <button class="btn-send" onclick="handleSend()">傳送</button>
      </div>
    </div>
  </div>

  <script>
    /* iOS 6 compatible - NO fetch(), NO arrow functions, NO let/const */
    var chatEl = document.getElementById('chat');

    function toggleMic() {
      var q = prompt("請輸入您想對 Siri 說的話：");
      if (q) sendQuery(q);
    }

    function handleSend() {
      var input = document.getElementById('queryInput');
      var q = input.value.replace(/^\s+|\s+$/g, '');
      if (!q) return;
      input.value = '';
      sendQuery(q);
    }

    function sendQuery(text) {
      appendBubble('user', text);
      var loadingEl = appendBubble('siri', '正在思考中...');

      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/siri', true);
      xhr.setRequestHeader('Content-Type', 'application/json');
      xhr.timeout = 30000;

      xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            loadingEl.innerHTML = data.reply || '抱歉，我目前無法回答這個問題。';

            if (data.card_type === 'weather' && data.card_data) {
              var card = document.createElement('div');
              card.className = 'siri-card card-weather';
              card.innerHTML =
                '<div><b>' + (data.card_data.city || '桃園市') + '</b><br>' + (data.card_data.condition || '') + '</div>' +
                '<div class="weather-temp">' + (data.card_data.temp || '') + '</div>';
              loadingEl.appendChild(card);
            } else if (data.card_type === 'stock' && data.card_data) {
              var card = document.createElement('div');
              card.className = 'siri-card card-stock';
              card.innerHTML =
                '<div><b>' + (data.card_data.name || '') + ' (' + (data.card_data.symbol || '') + ')</b></div>' +
                '<div class="stock-price">' + (data.card_data.price || '') + ' <span style="font-size:12px;">' + (data.card_data.change || '') + '</span></div>';
              loadingEl.appendChild(card);
            }

            chatEl.scrollTop = chatEl.scrollHeight;
          } catch (e) {
            loadingEl.innerHTML = '抱歉，回應解析錯誤。';
          }
        } else {
          loadingEl.innerHTML = '抱歉，Siri 暫時無法連線 (' + xhr.status + ')';
        }
      };

      xhr.ontimeout = function() {
        loadingEl.innerHTML = '抱歉，回應超時，請再試一次。';
      };

      xhr.onerror = function() {
        loadingEl.innerHTML = '抱歉，連線到 Siri 時發生網路錯誤。';
      };

      xhr.send(JSON.stringify({ query: text }));
    }

    function appendBubble(role, html) {
      var b = document.createElement('div');
      b.className = 'bubble ' + role;
      b.innerHTML = html;
      chatEl.appendChild(b);
      chatEl.scrollTop = chatEl.scrollHeight;
      return b;
    }
  </script>

</body>
</html>
